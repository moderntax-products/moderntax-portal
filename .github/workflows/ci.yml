# GitHub Actions CI — SOC 2 CC8.1 (Change Management)
#
# Mandatory pre-deploy gates that the dependency audit (H5) flagged as
# the single biggest control deficiency: no automated security or quality
# checks were enforced before code reached production. This workflow runs
# on every push to main and every PR, gating the merge on:
#   1. Strict lockfile install (npm ci)
#   2. Dependency audit (high+critical fail the build)
#   3. Lint (catches the unescaped-apostrophe class of failures that killed
#      two deploys in May 2026)
#   4. TypeScript strict typecheck (catches the unused-variable class that
#      killed the ERC merchant page deploy)
#   5. Production build (catches everything else)
#
# Companion: ../dependabot.yml schedules weekly dependency PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read  # explicit minimum; default GITHUB_TOKEN scope is too broad

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Dependency audit (fails on NEW high+critical, allowlists known)
        # Uses audit-ci (config: .audit-ci.json) so we get a STABLE gate:
        #   · Net-new HIGH/CRITICAL CVEs fail the build (the actual point)
        #   · Known unfixable HIGH advisories are allowlisted with GHSA IDs
        #     and tracked separately in the SOC 2 audit report.
        # When you upgrade the pinning dep, remove the corresponding IDs
        # from .audit-ci.json so the gate tightens again.
        #
        # 2026-07-27 — upgraded Next 14.2.35 -> 16.2.12, which resolved the
        # entire Next 14.x advisory batch plus two PostCSS advisories (fixed
        # by overriding postcss to ^8.5.23, which also patches the copy
        # `next` bundled internally) and a `sharp` CVE batch (fixed by
        # overriding sharp to ^0.35.0 — next pins ^0.34.5 as an optional
        # dependency for image optimization, which this app doesn't use).
        # That dropped the allowlist from 25 entries to 3. The remaining
        # three are still genuinely present and still non-exploitable here:
        #
        #   GHSA-4r6h-8v6p-xvw6  xlsx prototype pollution
        #   GHSA-5pgg-2g8v-p4x9  xlsx ReDoS
        #     -> both need an xlsx major-version upgrade (0.18.x -> 0.20.x+),
        #        tracked separately in the SOC 2 audit report (out of scope
        #        for this Next upgrade).
        #   GHSA-mh99-v99m-4gvg  brace-expansion DoS via unbounded expansion
        #                        (out-of-memory crash).
        #     -> transitive BUILD-TIME dep (eslint tooling / minimatch); it
        #        never expands untrusted runtime input in the shipped app.
        #        ESLint 10 would clear this; out of scope for this upgrade
        #        (eslint-config-next 16 only requires ESLint >=9).
        #
        # These suppress REAL advisories, they don't dismiss them. Re-check
        # the conditions above before adding any path that runs brace-expansion
        # on untrusted input, and drop these IDs once the pinning dep
        # (xlsx / eslint) is upgraded.
        run: npx audit-ci --config .audit-ci.json

      - name: Lint (eslint)
        # Next 16 removed `next lint`; migrated to the ESLint CLI directly
        # (flat config: eslint.config.mjs) via the official codemod.
        run: npx eslint .

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Production build
        run: npm run build
        env:
          # Build-time env stubs so Next can statically analyze. None of
          # these are real secrets — Vercel injects real values at deploy.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://portal.moderntax.io
